name: Build APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx cap sync android
      - run: mkdir -p android/capacitor-cordova-android-plugins
      - run: echo "ext { cdvPluginPostBuildExtras = [] }" > android/capacitor-cordova-android-plugins/cordova.variables.gradle
      - run: cd android && chmod +x gradlew && ./gradlew clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Suly-Besnes-APK-run-${{ github.run_number }}-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
