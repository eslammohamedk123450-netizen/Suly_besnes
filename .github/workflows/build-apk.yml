name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      
      - run: npm install --legacy-peer-deps
      - run: npm install @capacitor/android @capacitor/core @capacitor/assets --legacy-peer-deps
      - run: npm run build

      # متسمسحش الاندرويد لو موجود، ضيفه بس لو مش موجود
      - run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap copy android
          npx cap sync android

      # زود رقم الاصدار تلقائيا عشان يرضى يتثبت فوق القديم
      - run: |
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" android/app/build.gradle || sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" android/app/build.gradle.kts

      - run: cp public/icons/app-icon.png icon.png || cp public/icon.png icon.png || echo "icon not found skip"
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' || echo "skip assets"

      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Suly-Business-APK-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
