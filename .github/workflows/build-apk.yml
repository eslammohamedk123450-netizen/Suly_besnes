name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --legacy-peer-deps
      - run: npm install @capacitor/assets --legacy-peer-deps
      - run: npm run build
      - run: rm -rf android
      - run: npx cap add android
      - run: npx cap copy android
      - run: cp public/icons/app-icon.png icon.png
      - run: npx capacitor-assets generate --android --iconBackgroundColor "#0f172a" --iconBackgroundColorDark "#0f172a"
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Suly-Business-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
